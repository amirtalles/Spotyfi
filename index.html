<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guitar.pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Montserrat', sans-serif;
    }
    body {
      background-color: #f5f5f5;
      color: #111;
      overflow-x: hidden;
    }

    /* Navbar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 48px;
      background: #ffffff;
      border-bottom: 1px solid #ebebeb;
    }
    .logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -1px;
    }
    .logo span {
      font-size: 13px;
      font-weight: 500;
      color: #777;
    }
    nav {
      display: flex;
      gap: 36px;
    }
    nav a {
      text-decoration: none;
      color: #222;
      font-size: 14px;
      font-weight: 600;
      padding-bottom: 4px;
      transition: color 0.2s;
    }
    nav a.active {
      border-bottom: 2px solid #000;
    }
    .search-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    /* Hero Section */
    .hero-wrapper {
      position: relative;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      overflow: hidden;
    }
    .hero-img {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
    }

    /* Interactive Overlay Hotspots (در صورت نیاز به کلیک‌پذیر کردن کارت و دکمه‌ها) */
    .interactive-card {
      position: absolute;
      bottom: 4.5%;
      right: 3.5%;
      width: 18%;
      height: 28%;
      cursor: pointer;
    }
    .nav-scroll {
      position: absolute;
      bottom: 6%;
      left: 3.5%;
      cursor: pointer;
      width: 15%;
      height: 5%;
    }

    @media (max-width: 768px) {
      header {
        padding: 15px 20px;
      }
      nav {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- هدر دقیقاً مشابه طرح -->
  <header>
    <div class="logo">GUITAR<span>.pro</span></div>
    <nav>
      <a href="#" class="active">Guitars</a>
      <a href="#">Pedals</a>
      <a href="#">Amps</a>
      <a href="#">Accessories</a>
    </nav>
    <button class="search-btn" aria-label="Search">
      <svg width="20" height="20" fill="none" stroke="#222" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </button>
  </header>

  <!-- بنر اصلی با همان آرت‌ورک دقیق -->
  <main class="hero-wrapper">
    <!-- عکس ادیت‌شده را با نام guitar-hero.jpg کنار فایل قرار دهید -->
    <img class="hero-img" src="guitar-hero.jpg" alt="Electric Guitars Hero" />
    <a href="#riffs" class="interactive-card" title="Open Guitar Riffs & Licks"></a>
  </main>

</body>
</html>
