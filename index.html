<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Artist & Track Cover Flow</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      transition: background-color 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* نوار بالایی */
    .top-bar {
      position: absolute;
      top: 25px;
      left: 0;
      width: 100%;
      padding: 0 25px;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .glass-btn {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease, opacity 0.3s ease;
    }

    .glass-btn:active {
      transform: scale(0.92);
    }

    #back-btn {
      display: none;
      opacity: 0;
    }

    /* محیط‌های نمایش */
    .view-container {
      position: absolute;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.5s ease;
      touch-action: none;
    }

    .view-container.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.92);
    }

    .stage {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      perspective: 1000px;
    }

    /* استایل کارت‌های خواننده (دایره‌ای / پرتره شیک) */
    .artist-card {
      position: absolute;
      width: 200px;
      height: 200px;
      left: -100px;
      top: -100px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      will-change: transform, opacity;
      cursor: pointer;
      transition: transform 0.45s cubic-bezier(0.18, 0.9, 0.32, 1.15);
    }

    .artist-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    /* استایل کارت‌های موزیک و آلبوم (قوس دار) */
    .song-card {
      position: absolute;
      width: 160px;
      height: 240px;
      left: -80px;
      top: -120px;
      border-radius: 24px;
      overflow: hidden;
      background-color: #1e1b4b;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
      will-change: transform, opacity, filter;
      cursor: pointer;
    }

    .song-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    /* اطلاعات متنی و کنترل‌ها */
    .bottom-info {
      position: absolute;
      bottom: 40px;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 999;
      color: #ffffff;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }

    .text-title {
      font-size: 1.35rem;
      font-weight: 700;
      max-width: 85%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .text-subtitle {
      font-size: 0.92rem;
      opacity: 0.8;
      margin-top: 4px;
    }

    .play-trigger {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #ffffff;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      font-size: 1.4rem;
      display: none;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s ease;
    }

    .play-trigger:active {
      transform: scale(0.9);
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <button class="glass-btn" id="back-btn">⬅ بازگشت به خواننده‌ها</button>
    <label class="glass-btn">
      <span>➕ افزودن آهنگ‌ها</span>
      <input type="file" id="file-input" accept="audio/*" multiple hidden>
    </label>
  </div>

  <div class="view-container" id="artists-view">
    <div class="stage" id="artists-stage"></div>
  </div>
