<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guitar.pro - Electric Guitars</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background-color: #f7f7f7;
      color: #111;
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 60px;
      position: relative;
      z-index: 10;
      background: #ffffff;
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -1px;
      text-transform: uppercase;
    }

    .logo span {
      font-size: 14px;
      font-weight: 400;
      color: #666;
    }

    nav {
      display: flex;
      gap: 32px;
    }

    nav a {
      text-decoration: none;
      color: #333;
      font-size: 14px;
      font-weight: 600;
      transition: color 0.2s;
    }

    nav a.active, nav a:hover {
      color: #000;
      border-bottom: 2px solid #000;
      padding-bottom: 4px;
    }

    .header-icons {
      cursor: pointer;
    }

    /* Main Container */
    .hero-container {
      position: relative;
      height: calc(100vh - 80px);
      min-height: 620px;
      display: grid;
      grid-template-columns: 55% 45%;
      overflow: hidden;
    }

    /* Left Side */
    .left-section {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      padding: 40px;
    }

    .bg-text {
      position: absolute;
      left: 5%;
      top: 25%;
      font-size: clamp(3rem, 7vw, 7.5rem);
      font-weight: 900;
      line-height: 0.95;
      color: rgba(220, 220, 225, 0.6);
      text-transform: uppercase;
      user-select: none;
      z-index: 1;
      max-width: 400px;
    }

    .hero-main-img {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 500px;
      height: 80%;
      object-fit: cover;
      border-radius: 4px;
    }

    .scroll-hint {
      position: absolute;
      bottom: 40px;
      left: 50px;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 3;
    }

    .scroll-hint::before {
      content: "";
      width: 25px;
      height: 1px;
      background: #888;
    }

    /* Right Side */
    .right-section {
      position: relative;
      background: url('https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .right-guitar {
      max-height: 90%;
      z-index: 2;
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.4));
    }

    /* Top Right Indicator */
    .meta-indicator {
      position: absolute;
      top: 40px;
      right: 50px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .counter {
      font-size: 5rem;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.45);
      line-height: 1;
    }

    .indicator-text {
      margin-top: 8px;
      color: #fff;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 600;
      position: relative;
      padding-left: 20px;
    }

    .indicator-text::before {
      content: "";
      position: absolute;
      left: 0;
      top: 8px;
      width: 14px;
      height: 1px;
      background: #fff;
    }

    /* Floating Video Card */
    .floating-card {
      position: absolute;
      bottom: 30px;
      right: 40px;
      width: 230px;
      background: #fff;
      padding: 12px;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.2);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-thumb {
      width: 100%;
      height: 130px;
      object-fit: cover;
      border-radius: 2px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 800;
      color: #111;
    }

    .card-btn {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      text-decoration: none;
      color: #666;
      display: inline-block;
      letter-spacing: 0.5px;
      transition: color 0.2s;
    }

    .card-btn:hover {
      color: #000;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .hero-container {
        grid-template-columns: 1fr;
        height: auto;
      }
      .right-section {
        min-height: 450px;
      }
      header {
        padding: 18px 24px;
      }
      nav {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header>
    <div class="logo">Guitar<span>.pro</span></div>
    <nav>
      <a href="#" class="active">Guitars</a>
      <a href="#">Pedals</a>
      <a href="#">Amps</a>
      <a href="#">Accessories</a>
    </nav>
    <div class="header-icons">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </div>
  </header>

  <!-- Hero Section -->
  <main class="hero-container">
    
    <!-- Left Hero -->
    <section class="left-section">
      <div class="bg-text">Electric Guitars</div>
      <!-- تصویر آرتیست / نوازنده -->
      <img class="hero-main-img" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=1000&q=80" alt="Artist with guitar" />
      <div class="scroll-hint">Scroll and learn</div>
    </section>

    <!-- Right Hero -->
    <section class="right-section">
      <!-- نشانگر عددی بالا سمت راست -->
      <div class="meta-indicator">
        <div class="counter">02</div>
        <div class="indicator-text">Latest<br>New<br>Collection</div>
      </div>

      <!-- تصویر گیتار بدون بک‌گراند (PNG) -->
      <img class="right-guitar" src="https://pngimg.com/d/electric_guitar_PNG31.png" alt="Electric Guitar Standalone" />

      <!-- کارت کوچک شناور پایین سمت راست -->
      <div class="floating-card">
        <img class="card-thumb" src="https://images.unsplash.com/photo-1525201548942-d8732f6617a0?auto=format&fit=crop&w=600&q=80" alt="Guitar Riffs" />
        <div class="card-title">Guitar Riffs & Licks</div>
        <a href="#" class="card-btn">View More</a>
      </div>
    </section>

  </main>

</body>
</html>
