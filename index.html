<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Centered Squeeze Cover Flow</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #831843;
      /* ترنزیشن نرم و سینمایی تغییر رنگ پس‌زمینه */
      transition: background-color 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      font-family: system-ui, -apple-system, sans-serif;
    }

    .carousel-container {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1200px;
      touch-action: pan-y;
    }

    .cards-wrapper {
      position: relative;
      width: 0;
      height: 0;
    }

    .card {
      position: absolute;
      width: 160px;
      height: 235px;
      left: -80px;
      top: -117px;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      /* حرکت و بازگشت کشسان و نرم */
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.15), 
                  opacity 0.4s ease, 
                  filter 0.4s ease;
      will-change: transform, opacity;
      cursor: pointer;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .track-details {
      position: absolute;
      bottom: 60px;
      z-index: 200;
      text-align: center;
      color: #ffffff;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
      pointer-events: none;
    }

    .track-details h2 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .track-details p {
      font-size: 0.95rem;
      opacity: 0.8;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="carousel-container" id="carousel-area">
    <div class="cards-wrapper" id="cards-wrapper"></div>
  </div>

  <div class="track-details">
    <h2 id="current-title">عنوان موزیک</h2>
    <p id="current-artist">نام خواننده</p>
  </div>

  <script>
    const tracks = [
      {
        title: "Ceramic Minimal",
        artist: "Earthy Soul",
        cover: "https://images.unsplash.com/photo-1578749556568-bc2c40e68b61?w=500&q=80",
        bgColor: "#5c2b09"
      },
      {
        title: "Pattern Waves",
        artist: "Nordic Beats",
        cover: "https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=500&q=80",
        bgColor: "#701a35"
      },
      {
        title: "Pigeon Tone",
        artist: "Studio Track",
        cover: "https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?w=500&q=80",
        bgColor: "#2d3748"
      },
      {
        title: "Dark Portrait",
        artist: "Minimal Voice",
        cover: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&q=80",
        bgColor: "#171717"
      },
      {
        title: "Abstract Kinetic",
        artist: "Future Sound",
        cover: "https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=500&q=80",
        bgColor: "#0c4a6e"
      }
    ];

    const cardsWrapper = document.getElementById('cards-wrapper');
    const titleEl = document.getElementById('current-title');
    const artistEl = document.getElementById('current-artist');
    const carouselArea = document.getElementById('carousel-area');

    let currentIndex = 2;
    let isDragging = false;
    let startX = 0;
    let currentDragX = 0;

    tracks.forEach((track, index) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<img src="${track.cover}" alt="${track.title}">`;
      card.addEventListener('click', () => {
        currentIndex = index;
        updateCarousel();
      });
      cardsWrapper.appendChild(card);
    });

    const cards = document.querySelectorAll('.card');

    function updateCarousel(dragProgress = 0) {
      const radius = 300;
      const angleStep = 15;
      
      // میزان فشرده شدن کارت‌ها به هم در هنگام اسکرول/درگ
      const squeezeAmount = Math.min(Math.abs(dragProgress) * 25, 20);
      const baseSpacing = 58 - squeezeAmount; // فاصله بسیار نزدیک‌تر

      cards.forEach((card, index) => {
        const offset = (index - currentIndex) - dragProgress;
        const angle = offset * angleStep * (Math.PI / 180);
        
        // محاسبه قوس متمرکز در وسط
        const x = Math.sin(angle) * radius + (offset * baseSpacing);
        const y = (1 - Math.cos(angle)) * (radius * 0.7);
        const rotateZ = offset * angleStep;
        
        // محاسبه اسکیل برای برجسته‌سازی کارت مرکزی
        const absOffset = Math.abs(offset);
        const scale = Math.max(0.72, 1.06 - absOffset * 0.09);

        // اعمال انیمیشن نرم در لحظه رها کردن
        if (!isDragging) {
          card.style.transition = 'transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.15), opacity 0.4s ease, filter 0.4s ease';
        } else {
          card.style.transition = 'none'; // برای دنبال کردن بدون تاخیر انگشت
        }

        card.style.transform = `translate3d(${x}px, ${y}px, 0px) rotateZ(${rotateZ}deg) scale(${scale})`;
        card.style.zIndex = Math.round(100 - absOffset * 10);
        card.style.opacity = absOffset > 3.2 ? 0 : 1;
        card.style.filter = absOffset < 0.3 ? 'brightness(1)' : 'brightness(0.7)';
      });

      // تغییر رنگ پس‌زمینه بر اساس آیتم فعال
      const activeIdx = Math.max(0, Math.min(tracks.length - 1, Math.round(currentIndex + dragProgress)));
      document.body.style.backgroundColor = tracks[activeIdx].bgColor;
      titleEl.innerText = tracks[activeIdx].title;
      artistEl.innerText = tracks[activeIdx].artist;
    }

    // کنترل لمسی برای موبایل
    carouselArea.addEventListener('touchstart', (e) => {
      isDragging = true;
      startX = e.touches[0].clientX;
      currentDragX = 0;
    }, { passive: true });

    carouselArea.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      const diff = e.touches[0].clientX - startX;
      currentDragX = diff;
      
      // محاسبه نسبت جابجایی بر اساس عرض صفحه
      const dragProgress = -diff / (window.innerWidth * 0.45);
      updateCarousel(dragProgress);
    }, { passive: true });

    carouselArea.addEventListener('touchend', () => {
      if (!isDragging) return;
      isDragging = false;
      const threshold = 40;

      if (currentDragX < -threshold && currentIndex < tracks.length - 1) {
        currentIndex++;
      } else if (currentDragX > threshold && currentIndex > 0) {
        currentIndex--;
      }
      
      updateCarousel(0);
    });

    // اجرای اولیه
    updateCarousel(0);
  </script>
</body>
</html>
