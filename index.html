<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GUITAR.pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,600;0,900;1,900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #dcdcdc;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    /* کادر بیرونی مطابق عکس */
    .viewport {
      width: 100%;
      max-width: 1050px;
      aspect-ratio: 1000 / 625;
      background: #ffffff;
      box-shadow: 0 30px 60px rgba(0,0,0,0.18);
      position: relative;
      overflow: hidden;
    }

    /* تصویر اصلی ارسالی شما به عنوان پس‌زمینه کامل فریم */
    .mockup-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      z-index: 1;
    }

    /* لایه اجزای تعاملی و کلیک‌خور روی عکس */
    .interactive-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    /* منوی بالا (Header) */
    .nav-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 13%;
      display: flex;
      align-items: center;
      padding: 0 5%;
    }

    .brand-link {
      width: 14%;
      height: 60%;
      cursor: pointer;
    }

    .nav-links {
      display: flex;
      gap: 22px;
      margin-left: 5.5%;
    }

    .nav-links a {
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      color: transparent; /* شفاف شده تا متن روی خود تصویر دیده شود و همزمان قابل کلیک باشد */
      height: 24px;
      display: inline-block;
      cursor: pointer;
    }

    .search-btn {
      margin-left: auto;
      width: 25px;
      height: 25px;
      cursor: pointer;
      border-radius: 50%;
    }

    /* دکمه‌های هاور اسلایدر سمت راست (02 و کالکشن) */
    .slider-tag {
      position: absolute;
      top: 15%;
      right: 5%;
      width: 15%;
      height: 25%;
      cursor: pointer;
    }

    /* کارت تعاملی گوشه پایین سمت راست (Guitar Riffs & Licks) */
    .floating-card-action {
      position: absolute;
      bottom: 7.5%;
      right: 5.2%;
      width: 16.5%;
      height: 30%;
      cursor: pointer;
      border-radius: 2px;
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease;
    }

    .floating-card-action:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 12px 25px rgba(0,0,0,0.3);
      outline: 2px solid rgba(255,255,255,0.7);
    }

    /* خط راهنمای اسکرول در پایین سمت چپ */
    .scroll-action {
      position: absolute;
      bottom: 12%;
      left: 6%;
      width: 15%;
      height: 4%;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="viewport">
    <!-- تصویر ارسالی شما (نام فایل را با فایلتان یکسان کنید) -->
    <img src="guitar-mockup.png" alt="Guitar Website Interface" class="mockup-bg">

    <!-- لایه‌های کلیک‌خور و ناوبری منطبق بر روی طراحی -->
    <div class="interactive-layer">
      
      <header class="nav-bar">
        <a href="#home" class="brand-link" title="GUITAR.pro Home"></a>
        <nav class="nav-links">
          <a href="#guitars" title="Guitars" style="width: 45px;"></a>
          <a href="#pedals" title="Pedals" style="width: 40px;"></a>
          <a href="#amps" title="Amps" style="width: 35px;"></a>
          <a href="#accessories" title="Accessories" style="width: 70px;"></a>
        </nav>
        <div class="search-btn" title="Search"></div>
      </header>

      <!-- تگ اسلایدر و دسته‌بندی جدید -->
      <a href="#collection-02" class="slider-tag" title="View 02 - Latest New Collection"></a>

      <!-- اکشن کلیک برای ویدیو/کارت Guitar Riffs & Licks -->
      <a href="#riffs" class="floating-card-action" title="Guitar Riffs & Licks - See More"></a>

      <!-- اسکرول و گشت‌وگذار -->
      <a href="#explore" class="scroll-action" title="Scroll and explore"></a>

    </div>
  </div>

</body>
</html>
